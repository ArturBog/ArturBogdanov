<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="board-app">
    <header class="board-app__header">
      <h1>Task Manager</h1>
    </header>
    <main class="board-app__main">
      <div class="board-app__inner">
        <section class="add-task">
          <form class="add-task__form">
            <input type="text" class="add-task__input" placeholder="Новая задача..." required minlength="3">
            <button type="submit" class="add-task__button">Добавить</button>
          </form>
        </section>
        <section class="taskboard">
          <div class="taskboard__inner"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="src/main.js"></script>
</body>
</html>
